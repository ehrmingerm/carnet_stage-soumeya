<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Carnet de stage</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Instrument+Sans:wght@400;500;600;700&display=swap">
<style>
/* Charte « Communiquer en santé mentale » : fond blanc cassé, surfaces blanches arrondies, encre et un seul accent indigo, cartes pâles par état */
:root{
  --indigo:#4338F2; --encre:#0E0F12; --texte-fort:#23252C; --texte:#3B3E48;
  --texte-2:#5B5F6A; --texte-3:#6B6F7A; --bordure:#E6E6EA; --filet:#EEEEF2;
  --fond:#F7F7F5; --surface:#FFFFFF; --lavande:#F1F0F8; --indigo-pale:#ECEBFF; --indigo-texte:#2A1FB8;
  --vert-bg:#DDF5EA; --vert:#0B5A39; --corail-bg:#FFE9E2; --corail:#9A2E14; --jaune-bg:#FFF1CC; --jaune:#7A5200; --sable-bg:#EFEBE3; --sable:#5A4526;
  /* alias utilisés par le script */
  --accent:var(--indigo); --ink:var(--encre); --muted:var(--texte-2); --line:var(--bordure); --sunk:var(--fond); --on-accent:#FFFFFF;
  --ok:var(--vert); --warn:var(--jaune); --bad:var(--corail); --accent-soft:var(--indigo-pale);
  --titre:"Bricolage Grotesque",Arial,Helvetica,sans-serif;
  --corps:"Instrument Sans",Arial,Helvetica,sans-serif;
  --r-page:28px; --r-carte:22px; --r-petit:18px; --r-tag:8px;
  color-scheme:light;
}
*,*::before,*::after{box-sizing:border-box}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
[hidden]{display:none!important}
img{max-width:100%}
body{margin:0;background:var(--fond);color:var(--texte);font:400 15px/1.55 var(--corps)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--fond)}
.wrap{max-width:1080px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--titre);color:var(--encre);margin:0;text-wrap:balance}
h1{font-size:40px;line-height:43px;font-weight:700;letter-spacing:-1.4px}
h2{font-size:26px;line-height:30px;font-weight:700;letter-spacing:-.6px}
h3{font-size:19px;line-height:24px;font-weight:600;letter-spacing:-.3px}
a{color:var(--indigo);font-weight:600;text-decoration:none}
a:hover{text-decoration:underline}
code{font-size:.9em;background:var(--lavande);border-radius:6px;padding:1px 6px}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--texte-2)}
.small{font-size:14px;line-height:20px}
.label{font:600 13px/18px var(--corps);color:var(--indigo)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--indigo);outline-offset:2px}

/* En-tête */
.band{padding-top:20px}
.band>.wrap>.page{background:var(--surface);border:1px solid var(--bordure);border-radius:var(--r-page);padding:24px 28px;display:grid;gap:22px}
.brandbar{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:center;justify-content:space-between}
.brand{display:flex;align-items:center;gap:10px;color:var(--encre);text-decoration:none}
.brand:hover{text-decoration:none}
.brand .brand-img{display:block;height:40px;width:auto}
.brand .sq{width:36px;height:36px;border-radius:10px;background:var(--indigo);color:#fff;display:grid;place-items:center;font:700 24px/1 Georgia,"Times New Roman",serif;padding-top:9px}
.brand .l1{display:block;font:700 16px/18px var(--titre);color:var(--encre);letter-spacing:-.3px}
.brand .l2{display:block;font:400 14px/17px var(--corps);color:var(--texte-2)}
.brandbar .mention{font-size:13px;line-height:18px;text-align:right}
.brandbar .mention b{display:block;color:var(--encre);font-weight:600}
.brandbar .mention span{color:var(--texte-2)}
.ident{display:flex;flex-wrap:wrap;gap:14px 24px;align-items:flex-end;justify-content:space-between}
.ident h1{margin-top:4px}
.ident .meta{color:var(--texte-2);font-size:15px;line-height:22px;margin-top:6px}
.role{display:flex;flex-wrap:wrap;align-items:center;gap:8px;font-size:14px;color:var(--texte-2)}
.seg{display:inline-flex;background:var(--lavande);border-radius:999px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;padding:6px 14px;cursor:pointer;color:var(--texte);border-radius:999px;font-weight:500;font-size:14px}
.seg button[aria-pressed="true"]{background:var(--encre);color:#fff}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.kpi{background:var(--fond);border-radius:var(--r-petit);padding:14px 16px;display:grid;gap:4px;min-width:0;align-content:start}
.kpi .label{color:var(--texte-2);font-weight:500}
.kpi .v{font:700 24px/28px var(--titre);color:var(--encre);letter-spacing:-.5px;font-variant-numeric:tabular-nums}
.kpi .v small{font:400 13px/18px var(--corps);color:var(--texte-2);letter-spacing:0}
.hours{position:relative;height:6px;background:var(--bordure);border-radius:3px;margin-top:8px}
.hours i{position:absolute;inset:0 auto 0 0;background:var(--indigo);border-radius:3px}
.hours b{position:absolute;top:-3px;width:2px;height:12px;background:var(--texte-2);border-radius:1px}

/* Onglets */
nav.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--fond);padding-block:12px}
nav.tabs .wrap{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
nav.tabs a{flex:none;padding:8px 16px;color:var(--texte);text-decoration:none;border-radius:999px;font-weight:500;font-size:14px;background:var(--surface);border:1px solid var(--bordure)}
nav.tabs a:hover{border-color:var(--indigo);text-decoration:none}
nav.tabs a[aria-current="page"]{background:var(--encre);border-color:var(--encre);color:#fff}
nav.tabs a .count{font-size:12px;font-weight:700;background:var(--jaune-bg);color:var(--jaune);border-radius:var(--r-tag);padding:1px 7px;margin-left:6px;font-variant-numeric:tabular-nums}

main .wrap{padding-block:12px 48px;display:grid;gap:30px}
.notice{background:var(--corail-bg);color:var(--texte-fort);padding:14px 18px;border-radius:var(--r-petit);font-size:15px;line-height:22px}
.notice.info{background:var(--indigo-pale)}
.notice a{color:var(--indigo-texte)}

section.block{display:grid;gap:14px}
.block-head{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:baseline;justify-content:space-between;border-top:1px solid var(--bordure);padding-top:24px}
section.block:first-child>.block-head,section.block>.weeknav{border-top:0}
section.block>h2:first-child{border-top:1px solid var(--bordure);padding-top:24px}
.panel{background:var(--surface);border:1px solid var(--bordure);border-radius:var(--r-carte);padding:22px 24px}
.stack{display:grid;gap:12px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.grow{flex:1 1 220px;min-width:0}

/* Contrôles */
input[type=text],input[type=date],input[type=number],input[type=password],select,textarea{background:var(--surface);border:1px solid var(--bordure);border-radius:12px;padding:9px 12px;max-width:100%;font-size:15px}
input:hover,select:hover,textarea:hover{border-color:#CFCFD6}
textarea{width:100%;min-height:72px;resize:vertical;line-height:1.5}
input[type=text],input[type=password]{width:100%}
input:disabled,select:disabled,textarea:disabled{background:var(--fond);color:var(--texte-2)}
.field{display:grid;gap:5px;min-width:0}
.field>span{font-size:13px;color:var(--texte-2);font-weight:600}
.btn{border:1px solid var(--bordure);background:var(--surface);border-radius:999px;padding:9px 18px;cursor:pointer;font-weight:600;font-size:14px;white-space:nowrap;color:var(--encre)}
.btn:hover{border-color:var(--encre)}
.btn.primary{background:var(--encre);border-color:var(--encre);color:#fff;padding:12px 24px;font-size:15px}
.btn.primary:hover{background:#2A2C33}
.btn.ghost{border-color:transparent;background:transparent;color:var(--texte-2);padding:6px 10px}
.btn.ghost:hover{color:var(--encre)}
.btn.danger{color:var(--corail)}
.btn.armed{background:var(--corail);border-color:var(--corail);color:#fff}
.btn:disabled{opacity:.45;cursor:default}
input[type=range]{accent-color:var(--indigo);width:100%}
input[type=checkbox]{accent-color:var(--indigo);width:16px;height:16px}

/* Semaine */
.weeknav{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.weeknav select{font:600 16px/22px var(--corps);color:var(--encre);min-width:0;flex:1 1 220px;border-radius:999px;padding:10px 16px}
.weeknav .btn{min-width:42px}
.days{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.day{border-radius:var(--r-petit);padding:12px 14px;display:grid;gap:8px;background:var(--surface);border:1px solid var(--bordure)}
.day .d{font:600 17px/22px var(--titre);color:var(--encre);text-transform:capitalize;letter-spacing:-.2px}
.day select{width:100%;padding:6px 8px;font-size:14px;border-radius:10px}
.day[data-s="present"],.day[data-s="teletravail"]{background:var(--vert-bg);border-color:var(--vert-bg)}
.day[data-s="demi"]{background:var(--indigo-pale);border-color:var(--indigo-pale)}
.day[data-s="absent"]{background:var(--corail-bg);border-color:var(--corail-bg)}
.day[data-s="ferie"],.day[data-s="conge"]{background:var(--lavande);border-color:var(--lavande)}
.day[data-s="prevu"]{border:1.5px dashed var(--indigo)}
.mission-week{display:grid;grid-template-columns:minmax(0,1fr) minmax(160px,260px);gap:10px 20px;padding:18px 0;border-top:1px solid var(--filet)}
.mission-week:first-child{border-top:0;padding-top:0}
.mission-week:last-child{padding-bottom:0}
.mission-week .pct{display:flex;gap:10px;align-items:center}
.mission-week .pct output{font:700 17px/22px var(--titre);color:var(--encre);min-width:3.4em;text-align:right;font-variant-numeric:tabular-nums}
.delta{font-weight:600;color:var(--vert)}
.mission-week textarea{grid-column:1/-1;min-height:56px}
@media (max-width:560px){.mission-week{grid-template-columns:1fr}}

/* Étiquettes */
.pill{display:inline-flex;align-items:center;gap:6px;font-size:13px;line-height:18px;font-weight:700;padding:3px 9px;border-radius:var(--r-tag);background:var(--lavande);color:var(--texte);white-space:nowrap}
.pill::before{content:"●";font-size:9px}
.pill.ok{background:var(--vert-bg);color:var(--vert)}
.pill.warn{background:var(--jaune-bg);color:var(--jaune)}
.pill.bad{background:var(--corail-bg);color:var(--corail)}
.pill.acc{background:var(--indigo-pale);color:var(--indigo-texte)}
.tag{font-size:13px;line-height:18px;font-weight:700;color:var(--indigo-texte);background:var(--indigo-pale);border-radius:var(--r-tag);padding:3px 9px}

/* Listes */
.items{display:grid;border:1px solid var(--bordure);border-radius:var(--r-carte);background:var(--surface);padding:4px 24px}
.item{padding:17px 0;border-top:1px solid var(--filet);display:grid;gap:9px;min-width:0}
.item:first-child{border-top:0}
.item-head{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center}
.item-head .t{font:600 19px/24px var(--titre);color:var(--encre);letter-spacing:-.3px;flex:1 1 200px;min-width:0;overflow-wrap:anywhere}
.empty{padding:18px 0;color:var(--texte-2);font-size:15px}
.empty a{color:var(--indigo)}
.bar{height:6px;background:var(--bordure);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--indigo);border-radius:3px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}
details.edit>summary{cursor:pointer;color:var(--indigo);font-weight:600;font-size:14px;list-style:none}
details.edit>summary::-webkit-details-marker,details.panel>summary::-webkit-details-marker{display:none}
details.edit[open]>summary{margin-bottom:10px}
details.panel>summary .t::after{content:" ↓";color:var(--texte-3);font-weight:400}
details.panel[open]>summary .t::after{content:" ↑"}
.facts{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:14px;line-height:20px;color:var(--texte-2)}
.facts b{color:var(--encre);font-weight:600;font-variant-numeric:tabular-nums}
.spark{display:block}

/* Planning */
.gantt-wrap{overflow-x:auto;border:1px solid var(--bordure);border-radius:var(--r-carte);background:var(--surface)}
.gantt{display:grid;min-width:max-content;font-size:13px}
.gantt .lab{position:sticky;left:0;background:var(--surface);z-index:2;padding:8px 14px;border-right:1px solid var(--bordure);border-top:1px solid var(--filet);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--texte)}
.gantt .lab.clickable{cursor:pointer;color:var(--indigo);font-weight:600}
.gantt .hd{padding:8px 2px;text-align:center;color:var(--texte-2);border-left:1px solid var(--filet);line-height:1.25;font-size:12px}
.gantt .hd b{display:block;color:var(--encre);font:700 13px/17px var(--titre)}
.gantt .hd.now{background:var(--indigo-pale)}
.gantt .hdtrack{display:grid}
.gantt .track{position:relative;border-top:1px solid var(--filet);min-height:38px;background-image:linear-gradient(to right,var(--filet) 1px,transparent 1px);background-repeat:repeat-x}
.gantt .nowband{position:absolute;top:0;bottom:0;background:var(--indigo-pale)}
.gantt .today{position:absolute;top:0;bottom:0;width:2px;margin-left:-1px;background:var(--indigo);z-index:1}
.gantt .pt{position:absolute;top:50%;margin:-7px 0 0 -7px;z-index:2;padding:0;cursor:pointer}
.gantt .pt.t-mission{background:var(--indigo);border-color:var(--indigo)}
.gantt .pt.t-rencontre{background:var(--vert-bg);border-color:var(--vert)}
.gantt .pt.t-absence{background:var(--lavande);border-color:var(--texte-2)}
.gantt .pt.t-autre{background:var(--sable-bg);border-color:var(--sable)}
.gantt .plab{position:absolute;top:50%;transform:translateY(-50%);margin-left:12px;font-size:12px;font-weight:600;color:var(--texte-fort);white-space:nowrap;z-index:2;pointer-events:none}
.gantt .cell{border-left:1px solid var(--filet);border-top:1px solid var(--filet);min-height:34px;position:relative}
.gantt .gbar{position:absolute;top:7px;z-index:2;margin:0;min-width:10px;border-radius:var(--r-tag);padding:3px 8px;font-size:12px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#fff;background:var(--indigo);border:0;display:block;min-height:22px;text-align:left;cursor:pointer}
.gantt .gbar.t-echeance{background:var(--jaune-bg);color:var(--jaune)}
.gantt .gbar.t-absence{background:var(--lavande);color:var(--texte)}
.gantt .gbar.t-rencontre{background:var(--vert-bg);color:var(--vert)}
.gantt .gbar.t-autre{background:var(--sable-bg);color:var(--sable)}
.mark{display:block;margin:9px auto;width:12px;height:12px;transform:rotate(45deg);background:var(--jaune-bg);border:2px solid var(--jaune);border-radius:2px}
.mark.b{background:var(--indigo);border-color:var(--indigo)}
.mark.b.done{background:var(--vert);border-color:var(--vert)}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:13px;color:var(--texte-2)}
.legend span::before{content:"";display:inline-block;width:12px;height:12px;border-radius:4px;margin-right:6px;vertical-align:-1px;background:var(--indigo)}
.legend .lg-echeance::before{background:var(--jaune-bg);box-shadow:inset 0 0 0 1.5px var(--jaune)}
.legend .lg-rencontre::before{background:var(--vert-bg);box-shadow:inset 0 0 0 1.5px var(--vert)}
.legend .lg-absence::before{background:var(--lavande);box-shadow:inset 0 0 0 1.5px var(--texte-2)}
.legend .lg-autre::before{background:var(--sable-bg);box-shadow:inset 0 0 0 1.5px var(--sable)}

.checks{display:flex;flex-wrap:wrap;gap:6px}
.checks label{display:inline-flex;gap:7px;align-items:center;background:var(--fond);border-radius:999px;padding:6px 14px;cursor:pointer;font-size:14px}
.src{font-size:13px;line-height:18px;color:var(--texte-2)}

/* Gratification */
.tbl-wrap{overflow-x:auto;border:1px solid var(--bordure);border-radius:var(--r-carte);background:var(--surface)}
table.tbl{border-collapse:collapse;width:100%;min-width:840px;font-size:14px}
.tbl th,.tbl td{padding:11px 12px;border-top:1px solid var(--filet);text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.tbl thead th{border-top:0;font-size:13px;color:var(--texte-2);font-weight:600;vertical-align:bottom;padding-top:14px}
.tbl th:first-child,.tbl td:first-child{text-align:left;padding-left:20px}
.tbl td.m{font:600 16px/20px var(--titre);color:var(--encre)}
.tbl td .sub{display:block;font:400 12px/17px var(--corps);color:var(--texte-2)}
.tbl tr.avenir td{color:var(--texte-2)}
.tbl tr.avenir td.m{color:var(--texte-2)}
.tbl tfoot td{font-weight:700;color:var(--encre);border-top:1px solid var(--bordure);background:var(--fond)}
.tbl td.tot{font-weight:700;color:var(--encre)}
.tbl .verse{display:inline-flex;gap:6px;align-items:center}
.tbl .verse input[type=date]{padding:4px 8px;font-size:13px}
.ecart{color:var(--jaune);font-size:12px;display:block}
.formula{font-size:13px;background:var(--lavande);color:var(--texte-fort);border-radius:var(--r-tag);padding:2px 8px;white-space:nowrap}

/* Synchronisation et connexion */
.sync{font-size:13px;color:var(--texte-2);display:flex;flex-wrap:wrap;gap:4px 14px;align-items:center}
.sync .dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--vert);margin-right:6px;vertical-align:1px}
.sync .dot.saving{background:var(--jaune)}
.sync .dot.error{background:var(--corail)}
.sync button{border:0;background:none;color:var(--indigo);cursor:pointer;padding:0;font-size:13px;font-weight:600}
.setup{max-width:640px}
.setup .panel p{font-size:15px;line-height:23px}

footer.pied{text-align:center;font-size:12px;line-height:19px;color:var(--texte-3);padding-block:8px 32px}
footer.pied a{color:var(--texte-3);font-weight:400;text-decoration:underline}

@media (prefers-reduced-motion:no-preference){.bar i,.hours i{transition:width .3s}}
@media (max-width:620px){
  h1{font-size:32px;line-height:36px}h2{font-size:23px;line-height:27px}
  .band>.wrap>.page{padding:20px;border-radius:var(--r-carte)}
  .panel{padding:18px}.items{padding:2px 18px}
  .brandbar .mention{text-align:left}
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .kpi .v{font-size:21px;line-height:25px}
  .days{grid-template-columns:repeat(2,minmax(0,1fr))}
}
</style>
</head>

<header class="band"><div class="wrap"><div class="page" id="band"></div></div></header>
<nav class="tabs" aria-label="Rubriques"><div class="wrap" id="tabs"></div></nav>
<main><div class="wrap" id="app"><p class="muted">Chargement du carnet…</p></div></main>
<footer class="pied"><div class="wrap"><a href="guide.html">Guide d'utilisation</a> · <a href="https://communication-santementale.fr/" target="_blank" rel="noopener">communication-santementale.fr</a> · © 2026 Mickaël Worms-Ehrminger · Communiquer en santé mentale</div></footer>

<script>
(function(){
"use strict";
/* ---------- Constantes ---------- */
const VIEWS=[["semaine","Semaine"],["missions","Missions"],["validations","Validations et demandes"],["bilans","Bilans"],["remarques","Remarques"],["planning","Planning"],["gratification","Gratification"],["parametres","Paramètres"]];
const DAY_STATES=[["","Non renseigné"],["prevu","Prévu (à confirmer)"],["present","Présent"],["teletravail","Télétravail"],["demi","Demi-journée"],["absent","Absent"],["conge","Congé / fermeture"],["ferie","Férié"]];
const DAY_VAL={present:1,teletravail:1,demi:.5};
const MISSION_ST=[["a_venir","À venir",""],["en_cours","En cours","acc"],["terminee","Terminée","ok"],["suspendue","Suspendue","warn"]];
const DEM_TYPES=[["validation","Validation"],["demande","Demande"],["question","Question"]];
const DEM_ST=[["en_attente","En attente","warn"],["valide","Validé","ok"],["a_revoir","À revoir","bad"],["traite","Traité","ok"]];
const PLAN_TYPES=[["mission","Mission"],["echeance","Échéance"],["rencontre","Rendez-vous"],["absence","Absence / congé"],["autre","Autre"]];

/* Jours fériés en France métropolitaine */
const ferieCache={};
function feries(y){
  if(ferieCache[y])return ferieCache[y];
  const a=y%19,b=Math.floor(y/100),c=y%100,d=Math.floor(b/4),e=b%4,f=Math.floor((b+8)/25),g=Math.floor((b-f+1)/3),h=(19*a+b-d-g+15)%30,i=Math.floor(c/4),k=c%4,l=(32+2*e+2*i-h-k)%7,m=Math.floor((a+11*h+22*l)/451);
  const month=Math.floor((h+l-7*m+114)/31),day=((h+l-7*m+114)%31)+1;const easter=new Date(y,month-1,day);
  const s=new Set([`${y}-01-01`,`${y}-05-01`,`${y}-05-08`,`${y}-07-14`,`${y}-08-15`,`${y}-11-01`,`${y}-11-11`,`${y}-12-25`,toISO(addDays(easter,1)),toISO(addDays(easter,39)),toISO(addDays(easter,50))]);
  return ferieCache[y]=s;
}
const isFerie=iso=>feries(Number(iso.slice(0,4))).has(iso);

const dirty=new Map(), deleted=new Map(); let editSeq=0, saveTimer=null, queue=Promise.resolve();
const b64enc=str=>{const by=new TextEncoder().encode(str);let bin="";for(let i=0;i<by.length;i+=0x8000)bin+=String.fromCharCode.apply(null,by.subarray(i,i+0x8000));return btoa(bin)};
const b64dec=b=>new TextDecoder().decode(Uint8Array.from(atob(String(b).replace(/\s/g,"")),c=>c.charCodeAt(0)));
async function gh(path,opts){
  opts=opts||{};
  const r=await fetch("https://api.github.com"+path,Object.assign({},opts,{cache:"no-store",headers:Object.assign({"Accept":"application/vnd.github+json","Authorization":"Bearer "+token,"X-GitHub-Api-Version":"2022-11-28"},opts.body?{"Content-Type":"application/json"}:{})}));
  if(r.status===401)throw{code:"auth"};
  return r;
}
const contentsPath=()=>`/repos/${encodeURIComponent(GH.owner)}/${encodeURIComponent(GH.repo)}/contents/${GH.file}`;
async function pull(){
  const r=await gh(contentsPath()+"?ref="+encodeURIComponent(GH.branch));
  if(r.status===404){remoteSha=null;return{docs:{}}}
  if(!r.ok)throw{code:"http",status:r.status};
  const j=await r.json();remoteSha=j.sha;
  let data={};try{data=JSON.parse(b64dec(j.content)||"{}")}catch(e){throw{code:"format"}}
  return data&&typeof data==="object"?data:{};
}
function applyRemote(data){
  const docs=(data&&data.docs)||{};
  for(const p of [...store.docs.keys()])if(!dirty.has(p)&&!(p in docs))store.docs.delete(p);
  for(const [p,d] of Object.entries(docs))if(!dirty.has(p)&&!deleted.has(p))store.docs.set(p,d);
}
const LABELS={stage:"paramètres",semaines:"semaine",missions:"missions",demandes:"demandes",bilans:"bilans",remarques:"remarques",planning:"planning",versements:"versements"};
function commitMsg(changed,removed){
  const parts=new Set();changed.concat(removed).forEach(p=>{const[c,id]=p.split("/");parts.add(c==="semaines"?"semaine du "+id:(LABELS[c]||c))});
  return "Carnet : "+[...parts].join(", ")+(removed.length?" (suppression)":"");
}
function scheduleSave(delay){clearTimeout(saveTimer);saveTimer=setTimeout(()=>{saveTimer=null;enqueue(push)},Math.max(delay||0,1200))}
function enqueue(fn){queue=queue.then(fn).catch(onSyncError);return queue}
async function push(){
  if(!ghReady||(!dirty.size&&!deleted.size))return;
  syncState="saving";renderSync();
  for(let attempt=0;attempt<5;attempt++){
    const snapD=new Map(dirty),snapR=new Map(deleted);
    const remote=await pull();
    const docs=Object.assign({},remote.docs||{});
    snapD.forEach((_,p)=>{const d=store.docs.get(p);if(d)docs[p]=d});
    snapR.forEach((_,p)=>{delete docs[p]});
    const body={message:commitMsg([...snapD.keys()],[...snapR.keys()]),branch:GH.branch,content:b64enc(JSON.stringify({format:1,maj:new Date().toISOString(),docs},null,1))};
    if(remoteSha)body.sha=remoteSha;
    const r=await gh(contentsPath(),{method:"PUT",body:JSON.stringify(body)});
    if(r.status===409||r.status===422){await new Promise(res=>setTimeout(res,400+Math.random()*600));continue}
    if(r.status===403||r.status===404)throw{code:"forbidden"};
    if(!r.ok)throw{code:"http",status:r.status};
    const j=await r.json();remoteSha=j.content&&j.content.sha;
    snapD.forEach((seq,p)=>{if(dirty.get(p)===seq)dirty.delete(p)});
    snapR.forEach((seq,p)=>{if(deleted.get(p)===seq)deleted.delete(p)});
    applyRemote({docs});
    syncState=dirty.size||deleted.size?"saving":"idle";lastSync=new Date();writeError="";
    if(dirty.size||deleted.size)scheduleSave(0);
    scheduleRender();return;
  }
  throw{code:"conflict"};
}
async function refresh(){
  if(!ghReady||dirty.size||deleted.size||saveTimer)return;
  const data=await pull();applyRemote(data);lastSync=new Date();syncState="idle";scheduleRender();
}
function onSyncError(e){
  const code=e&&e.code;syncState="error";
  if(code==="auth"){writeError="Votre jeton GitHub n'est plus valide (expiré ou révoqué). Déconnectez-vous puis collez un nouveau jeton.";}
  else if(code==="forbidden"){writeError="Votre jeton ne permet pas d'écrire dans le dépôt. Vérifiez qu'il donne accès à ce dépôt avec la permission Contents en lecture et écriture.";}
  else if(code==="format"){writeError="Le fichier de données du dépôt est illisible. Aucune modification n'a été écrite. Restaurez une version précédente du fichier dans l'historique GitHub.";}
  else if(code==="conflict"){writeError="L'enregistrement a échoué après plusieurs tentatives. Vos saisies sont conservées sur cette page : réessayez dans un instant.";}
  else{writeError="Les dernières modifications n'ont pas pu être enregistrées (connexion interrompue ?). Elles restent sur cette page et seront renvoyées à la prochaine saisie.";}
  scheduleRender();
}

}

/* ---------- Calendrier du stage ---------- */
function cfg(){
  const c=Object.assign({},DEFAULT_CFG,getDoc("stage/config")||{});
  const today=new Date();
  let debut=parseISO(c.debut),fin=parseISO(c.fin);
  const provisional=!debut||!fin||fin<debut;
  if(provisional){debut=mondayOf(today);fin=addDays(debut,7*12-3)}
  return Object.assign(c,{debutD:debut,finD:fin,provisional,heuresJour:Number(c.heuresJour)||7,joursTravailles:Array.isArray(c.joursTravailles)&&c.joursTravailles.length?c.joursTravailles:[1,2,3,4,5]});
}
function weeks(){const c=cfg();const out=[];let m=mondayOf(c.debutD);while(m<=c.finD&&out.length<104){out.push(toISO(m));m=addDays(m,7)}return out}
function workDates(wk){
  const c=cfg();const m=parseISO(wk);
  return c.joursTravailles.slice().sort().map(dn=>addDays(m,dn-1)).filter(d=>d>=c.debutD&&d<=c.finD).map(toISO);
}
function dayState(doc,iso){const s=doc&&doc.jours&&doc.jours[iso];return s||(isFerie(iso)?"ferie":"")}
function weekStats(wk){
  const doc=getDoc("semaines/"+wk);let realise=0,prevu=0,renseigne=0,planifies=0;const dates=workDates(wk);
  for(const iso of dates){const s=dayState(doc,iso);if(s!=="ferie"&&s!=="conge")prevu++;if(s&&s!=="ferie"&&s!=="prevu")renseigne++;if(s==="prevu")planifies++;realise+=DAY_VAL[s]||0}
  return{realise,prevu,renseigne,planifies,total:dates.length};
}
function currentWeek(){const ws=weeks();const t=toISO(mondayOf(new Date()));if(t<ws[0])return ws[0];if(t>ws[ws.length-1])return ws[ws.length-1];return t}
const weekIndex=wk=>weeks().indexOf(wk)+1;
function weekLabel(wk,withIndex){
  const dates=workDates(wk);const m=parseISO(wk);
  const a=dates.length?parseISO(dates[0]):m,b=dates.length?parseISO(dates[dates.length-1]):addDays(m,4);
  const range=a.getMonth()===b.getMonth()?`${a.getDate()}–${fShort.format(b)}`:`${fShort.format(a)} – ${fShort.format(b)}`;
  return (withIndex!==false?`S${weekIndex(wk)} · `:"")+range;
}
function quinzaines(){const ws=weeks();const out=[];for(let i=0;i<ws.length;i+=2)out.push({n:i/2+1,weeks:ws.slice(i,i+2)});return out}
function quinzaineEnd(q){const last=q.weeks[q.weeks.length-1];const d=workDates(last);return d.length?d[d.length-1]:toISO(addDays(parseISO(last),4))}

/* Avancement des missions */
function missionHistory(id){const out=[];for(const wk of weeks()){const a=getIn(getDoc("semaines/"+wk)||{},"avancement."+id+".pct");if(typeof a==="number")out.push({wk,pct:a})}return out}
function pctBefore(id,wk){let v=null;for(const w of weeks()){if(w>=wk)break;const a=getIn(getDoc("semaines/"+w)||{},"avancement."+id+".pct");if(typeof a==="number")v=a}return v}
function latestPct(id){const h=missionHistory(id);return h.length?h[h.length-1].pct:0}
function sparkline(id){
  const h=missionHistory(id);if(h.length<2)return"";
  const W=120,H=28,ws=weeks(),n=Math.max(ws.length-1,1);
  const pts=h.map(p=>[(ws.indexOf(p.wk)/n)*W,H-2-(p.pct/100)*(H-4)]);
  const line=pts.map((p,i)=>(i?"L":"M")+p[0].toFixed(1)+" "+p[1].toFixed(1)).join(" ");
  const area=line+` L${pts[pts.length-1][0].toFixed(1)} ${H} L${pts[0][0].toFixed(1)} ${H} Z`;
  const e=pts[pts.length-1];
  return `<svg class="spark" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" aria-hidden="true"><path d="${area}" fill="var(--accent-soft)"/><path d="${line}" fill="none" stroke="var(--accent)" stroke-width="1.5"/><circle cx="${e[0].toFixed(1)}" cy="${e[1].toFixed(1)}" r="2.5" fill="var(--accent)"/></svg>`;
}

      <div class="pct"><input type="range" min="0" max="100" step="5" id="av-${wk}-${m.id}" value="${v}" aria-label="Avancement de ${esc(m.titre)}" data-bind="${path}|avancement.${m.id}.pct" data-num="1"${ro()}><output class="num" id="out-${wk}-${m.id}">${v} %</output></div>
      <textarea id="avn-${wk}-${m.id}" placeholder="Réalisé cette semaine, prochaines étapes, difficultés" data-bind="${path}|avancement.${m.id}.note"${ro()}>${esc(getIn(doc,"avancement."+m.id+".note")||"")}</textarea></div>`}).join("")
    :`<div class="empty">Aucune mission en cours. <a href="#missions">Ajouter ou démarrer une mission</a></div>`;
  const dem=coll("demandes");const ofWeek=dem.filter(d=>d.semaine===wk).sort((a,b)=>(a.cree||"").localeCompare(b.cree||""));
  const carried=dem.filter(d=>d.semaine<wk&&["en_attente","a_revoir"].includes(d.statut||"en_attente"));

    <button class="btn" data-action="week" data-v="${ws[i+1]||""}"${i>=ws.length-1?" disabled":""} aria-label="Semaine suivante">›</button>

  </div></section>
  ${endOfQ?`<div class="notice info">Fin de la quinzaine n° ${qn}. Bilan ${bil.statut==="fait"?"réalisé":"à compléter"}. <a href="#bilans" data-action="gobilan" data-v="${qn}">Ouvrir le bilan n° ${qn}</a></div>`:""}

/* Bilans */
let openBilan=null,pendingBilan=false;
function renderBilans(){

  return `<section class="block"><div class="block-head"><h2>Bilans de quinzaine</h2><span class="small muted">Un bilan toutes les deux semaines, à remplir à deux lors de l'entretien.</span></div>

function bilanCard(q,cq){
  const path="bilans/q"+q.n,b=getDoc(path)||{},done=b.statut==="fait";
  let real=0,prev=0;q.weeks.forEach(w=>{const s=weekStats(w);real+=s.realise;prev+=s.prevu});
  const ms=coll("missions");const moves=ms.map(m=>{const before=pctBefore(m.id,q.weeks[0]);let after=null;q.weeks.forEach(w=>{const v=getIn(getDoc("semaines/"+w)||{},"avancement."+m.id+".pct");if(typeof v==="number")after=v});return after==null?null:{t:m.titre,from:before||0,to:after}}).filter(Boolean);
  const dem=coll("demandes").filter(d=>q.weeks.includes(d.semaine));
  const state=done?`<span class="pill ok">Réalisé</span>`:q.n<cq?`<span class="pill warn">À compléter</span>`:q.n===cq?`<span class="pill acc">Quinzaine en cours</span>`:`<span class="pill">À venir</span>`;
  const isOpen=openBilan===q.n||(openBilan===null&&q.n===cq);
  const F=(f,l,ph)=>`<label class="field"><span>${l}</span><textarea id="b${q.n}-${f}" data-bind="${path}|${f}" placeholder="${esc(ph||"")}"${ro()}>${esc(b[f]||"")}</textarea></label>`;
  return `<details class="panel" id="x-b-${q.n}"${isOpen?" open":""} data-bilan="${q.n}"><summary style="cursor:pointer;list-style:none"><div class="item-head"><span class="t">Bilan n° ${q.n} · ${esc(q.weeks.map(w=>"S"+weekIndex(w)).join(" et "))} · ${esc(fShort.format(parseISO(workDates(q.weeks[0])[0]||q.weeks[0])))} au ${esc(fShort.format(parseISO(quinzaineEnd(q))))}</span>${state}</div></summary>
   <div class="stack" style="margin-top:12px">
    <div class="facts"><span>Jours réalisés <b>${nf.format(real)}/${prev}</b></span>${moves.map(m=>`<span>${esc(m.t||"Mission")} <b>${m.from} → ${m.to} %</b></span>`).join("")}<span>Demandes déposées <b>${dem.length}</b></span></div>
    <div class="grid2">${F("travaux","Travaux réalisés","Principales réalisations de la quinzaine")}${F("pointsForts","Points positifs, acquis")}${F("difficultes","Difficultés rencontrées")}${F("objectifs","Objectifs pour la quinzaine suivante")}${F("avisTuteur","Appréciation du tuteur")}${F("avisStagiaire","Ressenti de la stagiaire")}</div>
    <div class="row"><label class="field"><span>Date de l'entretien</span><input type="date" id="b${q.n}-date" data-bind="${path}|date" value="${esc(b.date||quinzaineEnd(q))}"${ro()}></label>

   </div></details>`;
}

/* Planning */
const fDayShort=new Intl.DateTimeFormat("fr-FR",{weekday:"short",day:"numeric",month:"short"});
function planDates(it){
  let d=it.debut||"",f=it.fin||it.debut||"";
  if(!it.exact&&f){const fd=parseISO(f);if(fd&&fd.getDay()===1)f=toISO(addDays(fd,4))}
  if(f<d)f=d;return{d,f};
}
function planRange(it){const{d,f}=planDates(it);const a=parseISO(d),b=parseISO(f);if(!a)return "";
  return d===f?fDayShort.format(a):`du ${fDayShort.format(a)} au ${fDayShort.format(b)}${a.getFullYear()!==b.getFullYear()?" "+b.getFullYear():""}`}
function renderPlanning(){
  const ws=weeks(),cw=currentWeek(),n=ws.length,t0=parseISO(ws[0]),total=n*7;
  const dayIdx=iso=>{const x=parseISO(iso);return x?Math.round((x-t0)/864e5):0};
  const pct=v=>(Math.max(0,Math.min(total,v))/total*100).toFixed(3)+"%";
  const items=coll("planning").map(it=>Object.assign({},it,{_d:planDates(it)})).sort((a,b)=>a._d.d.localeCompare(b._d.d)||a._d.f.localeCompare(b._d.f));
  const today=toISO(new Date()),ti=dayIdx(today),cwi=ws.indexOf(cw);
  const cols=`minmax(130px,190px) minmax(${n*58}px,1fr)`;
  const deco=`${cwi>=0?`<span class="nowband" style="left:${pct(cwi*7)};width:${pct(7)}"></span>`:""}${ti>=0&&ti<total?`<span class="today" style="left:${pct(ti+.5)}" title="Aujourd'hui"></span>`:""}`;
  const track=(inner,extra)=>`<div class="track" style="background-size:calc(100% / ${n}) 100%"${extra||""}>${deco}${inner}</div>`;
  const hd=`<div class="lab hd" style="border-top:0;text-align:left">Semaine</div><div class="hdtrack" style="grid-template-columns:repeat(${n},1fr)">`+ws.map(w=>`<div class="hd${w===cw?" now":""}"><b>S${weekIndex(w)}</b>${esc(fShort.format(parseISO(w)).replace(".",""))}</div>`).join("")+`</div>`;
  const rowOf=(label,inner,cls,attr)=>`<div class="lab${cls||""}"${attr||""} title="${esc(label)}">${esc(label)}</div>`+track(inner);
  const point=(iso,cls,title,label)=>`<span class="pt mark${cls?" "+cls:""}" style="left:${pct(dayIdx(iso)+.5)}" title="${esc(title)}"></span>${label?`<span class="plab" style="left:${pct(dayIdx(iso)+.5)}">${esc(label)}</span>`:""}`;
  let rows="";
  items.forEach(it=>{
    const s0=dayIdx(it._d.d),e0=dayIdx(it._d.f)+1,span=e0-s0,title=(it.libelle||"")+" · "+planRange(it);
    let inner;
    if(span<=2){inner=`<button type="button" class="pt mark t-${esc(it.type||"mission")}" style="left:${pct((s0+e0)/2)}" data-action="planedit" data-v="${it.id}" title="${esc(title)}" aria-label="${esc(title)}"></button><span class="plab" style="left:${pct((s0+e0)/2)}">${esc(it.libelle||"")}</span>`}

/* Gratification */
const fEur=new Intl.NumberFormat("fr-FR",{style:"currency",currency:"EUR"});
const fMonth=new Intl.DateTimeFormat("fr-FR",{month:"long",year:"numeric"});
const num=(v,d)=>v===""||v==null||isNaN(Number(v))?d:Number(v);
const r2=x=>Math.round(x*100)/100;
function rateFor(year,c){const r=Object.assign({},DEFAULT_RATES);Object.entries(c.tauxHoraires||{}).forEach(([k,v])=>{if(v!==""&&v!=null&&!isNaN(Number(v)))r[k]=Number(v)});if(r[year]!=null)return r[year];const ys=Object.keys(r).sort();return r[ys[ys.length-1]]}
function gParams(c){return{repas:num(c.repasJour,4.5),repasDemi:!!c.repasDemi,tAnnuel:num(c.transportAnnuel,401),tTaux:num(c.transportTaux,100),tBase:c.transportBase==="site"?"site":"reels"}}
function monthWorkdays(mk,c){const[y,m]=mk.split("-").map(Number);let n=0;for(let d=new Date(y,m-1,1);d.getMonth()===m-1;d=addDays(d,1)){const dn=d.getDay();if(dn&&c.joursTravailles.includes(dn)&&!isFerie(toISO(d)))n++}return n}
function monthsData(){
  const c=cfg(),P=gParams(c),today=toISO(new Date()),tm=today.slice(0,7),map=new Map();
  for(const wk of weeks()){const doc=getDoc("semaines/"+wk);for(const iso of workDates(wk)){
    const mk=iso.slice(0,7);if(!map.has(mk))map.set(mk,{mk,reels:0,site:0,repasJours:0,prevus:0,restants:0,nonRens:0,planifies:0,aConfirmer:0});
    const o=map.get(mk),s=dayState(doc,iso);
    if(s!=="ferie"&&s!=="conge")o.prevus++;
    if(s==="present"){o.reels++;o.site++;o.repasJours++}
    else if(s==="demi"){o.reels+=.5;o.site+=.5;if(P.repasDemi)o.repasJours++}
    else if(s==="teletravail"){o.reels++}
    else if(s==="prevu"){o.planifies++;if(iso<=today)o.aConfirmer++}
    if(!s){if(iso>today)o.restants++;else o.nonRens++}
  }}
  const tr=(base,ouvres)=>ouvres?r2(P.tAnnuel/12*P.tTaux/100*Math.min(1,base/ouvres)):0;
  const quota=num(c.joursConvention,0),all=[...map.values()],doneTot=all.reduce((a,o)=>a+o.reels,0),restTot=all.reduce((a,o)=>a+o.restants,0),planTot=all.reduce((a,o)=>a+o.planifies,0);
  const f=quota>0?(restTot>0?Math.max(0,Math.min(1,(quota-doneTot-planTot)/restTot)):0):1;
  return all.map(o=>{
    const rate=rateFor(o.mk.slice(0,4),c),heures=o.reels*c.heuresJour,ouvres=monthWorkdays(o.mk,c);
    const gratif=r2(heures*rate),repas=r2(o.repasJours*P.repas),transport=tr(P.tBase==="site"?o.site:o.reels,ouvres);
    const eR=o.restants*f+o.planifies,eReels=o.reels+eR,eSite=o.site+eR;
    const estTotal=r2(eReels*c.heuresJour*rate)+r2((o.repasJours+eR)*P.repas)+tr(P.tBase==="site"?eSite:eReels,ouvres);
    const v=getDoc("versements/"+o.mk)||{};
    return Object.assign(o,{rate,heures,ouvres,gratif,repas,transport,total:r2(gratif+repas+transport),estTotal:r2(estTotal),verse:!!v.verse,montantVerse:typeof v.montant==="number"?v.montant:null,dateVersement:v.date||"",status:o.mk<tm?"clos":o.mk===tm?"cours":"avenir"});
  });
}

const app=document.body;
function bindValue(el){
  const [path,field]=el.dataset.bind.split("|");let v=el.type==="checkbox"?el.checked:el.value;
  if(el.dataset.num)v=v===""?null:Number(v);
  return{path,field,v};
}
app.addEventListener("input",e=>{
  const el=e.target;if(!el.dataset||!el.dataset.bind)return;
  const{path,field,v}=bindValue(el);
  if(el.type==="range"){const o=el.parentElement.querySelector("output");if(o)o.textContent=v+" %";edit(path,d=>setIn(d,field,v),600);return}
  if(el.tagName==="TEXTAREA"||el.type==="text"||el.type==="number"){edit(path,d=>setIn(d,field,v),800)}
});
app.addEventListener("change",e=>{
  const el=e.target;
  if(el.dataset&&el.dataset.bind){const{path,field,v}=bindValue(el);
    if(path.startsWith("planning/")&&(field==="debut"||field==="fin")){if(!v)return;edit(path,d=>{const pd=planDates(d);d.debut=pd.d;d.fin=pd.f;d[field]=v;if(d.fin<d.debut){if(field==="debut")d.fin=d.debut;else d.debut=d.fin}d.exact=true},0);scheduleRender();return}
    if(el.tagName==="TEXTAREA"||el.type==="text"||el.type==="number"){edit(path,d=>setIn(d,field,v),0);if(el.type==="number")scheduleRender();return}
    if(el.type==="range"){edit(path,d=>setIn(d,field,v),0);scheduleRender();return}
    edit(path,d=>setIn(d,field,v),0);scheduleRender();return}
  if(el.dataset&&el.dataset.action==="verse"){const mk=el.dataset.v,tot=Number(el.dataset.total);edit("versements/"+mk,d=>{d.verse=el.checked;d.montant=el.checked?tot:null;if(el.checked&&!d.date)d.date=toISO(new Date())},0);scheduleRender();return}
  if(el.dataset&&el.dataset.action==="weeksel"){selWeek=el.value;ls.set("carnet-soumeya-week",selWeek);scheduleRender()}
  if(el.dataset&&el.dataset.action==="jt"){const n=Number(el.dataset.v);edit("stage/config",d=>{let a=Array.isArray(d.joursTravailles)?d.joursTravailles.slice():[1,2,3,4,5];a=el.checked?[...new Set([...a,n])]:a.filter(x=>x!==n);if(!a.length)a=[n];d.joursTravailles=a.sort()},0);scheduleRender()}
});
app.addEventListener("click",e=>{
  const el=e.target.closest("[data-action]");if(!el||el.tagName==="SELECT"||el.type==="checkbox")return;
  const a=el.dataset.action,v=el.dataset.v;
  if(a==="refresh"){enqueue(refresh);return}
  if(a==="logout"){if(dirty.size||deleted.size){enqueue(push).then(()=>{if(!dirty.size&&!deleted.size)logout()})}else logout();return}
  if(a==="week"&&v){selWeek=v;ls.set("carnet-soumeya-week",v);scheduleRender()}
  else if(a==="role"){role=v;ls.set("carnet-soumeya-role",v);scheduleRender()}
  else if(a==="demfilter"){demFilter=v;scheduleRender()}
  else if(a==="gobilan"){openBilan=Number(v);pendingBilan=true}
  else if(a==="planedit"){planEdit=v||null;scheduleRender();if(v)setTimeout(()=>{const f=document.getElementById("planform");if(f)f.scrollIntoView({block:"start",behavior:"smooth"})},60)}
  else if(a==="del"){
    if(!el.classList.contains("armed")){el.classList.add("armed");const t=el.textContent;el.dataset.t=t;el.textContent="Confirmer la suppression";setTimeout(()=>{if(el.isConnected){el.classList.remove("armed");el.textContent=el.dataset.t}},4000);return}
    if(el.dataset.path.startsWith("planning/"))planEdit=null;
    if(el.dataset.path.startsWith("missions/")){const id=el.dataset.path.slice(9);weeks().forEach(w=>{const d=getDoc("semaines/"+w);if(d&&d.avancement&&d.avancement[id])edit("semaines/"+w,x=>{delete x.avancement[id]},0)})}
    removeDoc(el.dataset.path);
  }
});
app.addEventListener("toggle",e=>{const d=e.target;if(d.dataset&&d.dataset.bilan&&d.open)openBilan=Number(d.dataset.bilan)},true);
app.addEventListener("submit",e=>{
  const f=e.target.closest("form[data-form]");if(!f)return;e.preventDefault();
  if(f.dataset.form==="token"){const fd=Object.fromEntries(new FormData(f).entries());token=(fd.token||"").trim();
    GH.owner=(fd.owner||GH.owner).trim();GH.repo=(fd.repo||GH.repo).trim();GH.branch=(fd.branch||GH.branch).trim()||"main";
    ls.set("carnet-soumeya-gh-token",token);ls.set("carnet-soumeya-gh-repo",JSON.stringify({owner:GH.owner,repo:GH.repo,branch:GH.branch}));connect();return}
  if(readOnly)return;
  const fd=Object.fromEntries(new FormData(f).entries());const now=new Date().toISOString();const id=uid();const kind=f.dataset.form;
  if(kind==="mission")edit("missions/"+id,d=>Object.assign(d,{titre:fd.titre.trim(),statut:fd.statut,echeance:fd.echeance||"",livrable:fd.livrable||"",description:fd.description||"",cree:now}),0);
  if(kind==="demande")edit("demandes/"+id,d=>Object.assign(d,{type:fd.type,objet:fd.objet.trim(),detail:fd.detail||"",echeance:fd.echeance||"",semaine:fd.semaine,auteur:role,statut:"en_attente",reponse:"",cree:now}),0);
  if(kind==="remarque")edit("remarques/"+id,d=>Object.assign(d,{texte:fd.texte.trim(),date:fd.date||toISO(new Date()),cat:fd.cat,auteur:role,cree:now}),0);
  if(kind==="planning"){let a=fd.debut,b=fd.fin||fd.debut;if(!a)return;if(b<a)[a,b]=[b,a];edit("planning/"+id,d=>Object.assign(d,{libelle:fd.libelle.trim(),type:fd.type,debut:a,fin:b,exact:true,note:"",cree:now}),0)}
  f.reset();scheduleRender();
});
window.addEventListener("hashchange",()=>{const h=location.hash.slice(1);if(VIEWS.some(v=>v[0]===h)){view=h;scheduleRender();window.scrollTo({top:0})}});
window.addEventListener("beforeunload",e=>{if(dirty.size||deleted.size){if(saveTimer){clearTimeout(saveTimer);saveTimer=null;enqueue(push)}e.preventDefault();e.returnValue=""}});
function logout(){try{localStorage.removeItem("carnet-soumeya-gh-token")}catch(e){}token="";ghReady=false;ghLogin="";store.docs.clear();dirty.clear();deleted.clear();remoteSha=null;writeError="";readOnly=false;isOwner=false;scheduleRender()}
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible")enqueue(refresh)});
setInterval(()=>{if(document.visibilityState==="visible")enqueue(refresh)},60000);

/* ---------- Démarrage ---------- */
render();
if(token)connect();
})();
</script>

</body>
</html>
